stages: [plan, apply]

default:
  image: alpine:3.21
  before_script:
    - . "$CI_PROJECT_DIR/.gitlab/opentofu/prepare.sh"

plan:
  stage: plan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
  environment:
    name: "opentofu/$TF_STATE_NAME"
  script:
    - tofu plan -input=false -lock=false -var-file="$TOFU_VARS" -out=plan.cache
    - if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then sh "$CI_PROJECT_DIR/.gitlab/opentofu/post_plan_summary.sh"; fi
  artifacts:
    access: developer
    expire_in: 1 day
    paths:
      - "$TF_ROOT/plan.cache"

apply:
  stage: apply
  environment:
    name: "opentofu/$TF_STATE_NAME"
  needs:
    - job: plan
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_ID == null'
      when: manual
      allow_failure: false
  script:
    - sh "$CI_PROJECT_DIR/.gitlab/opentofu/apply_guard.sh"
    - tofu apply -input=false -lock-timeout=0s plan.cache
