---
docker_data_dir: /opt/docker/data
# Registry domain for container images. The compose templates reference the
# flat docker_registry_domain var; map it to the nested docker.registry.domain
# (artifactory.local.hejsan.xyz/docker) so images pull from the local registry.
docker_registry_domain: "{{ docker.registry.domain }}"
# Media services no longer depend on the storage server NFS mount. Keep any
# future Docker bind mounts on local disk instead of allowing a missing mount
# point to become a write target.
docker_storage_dir: /opt/docker/storage
docker_puid: 1000
docker_pgid: 1000
timezone: "Europe/Stockholm"
