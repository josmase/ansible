---
# Version last observed on the live control plane; recheck before onboarding.
k3s_node_install_version: v1.37.2+k3s1
k3s_node_install_token: "{{ k3s_token }}"
k3s_node_install_name: "{{ k8s_node_name }}"
k3s_node_install_ip: "{{ ansible_host }}"
k3s_node_install_interface: "{{ flannel_iface | default('eth0') }}"
k3s_node_install_server_url: https://192.168.1.200:6443
k3s_node_install_verify_host: kubernetes-201.local.hejsan.xyz

# Shared endpoint used by the K3s rolling upgrade role.
apiserver_endpoint: 192.168.1.200

kube_vip_arp: true
kube_vip_bgp: false
kube_vip_bgp_routerid: "127.0.0.1"
kube_vip_bgp_as: "64513"
kube_vip_bgp_peeraddress: 192.168.1.1
kube_vip_bgp_peeras: "64512"
kube_vip_tag_version: v1.3.0

metal_lb_type: native
metal_lb_mode: layer2
metal_lb_speaker_tag_version: v0.14.8
metal_lb_controller_tag_version: v0.14.8
metal_lb_ip_range: "192.168.1.180-192.168.1.190"

proxmox_lxc_configure: false
custom_registries: false

# Existing control-plane taint:
# node-role.kubernetes.io/master=true:NoSchedule
