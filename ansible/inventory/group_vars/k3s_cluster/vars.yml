---
# Cluster install parameters -- mirrors k3s-ansible inventory/my-cluster/group_vars/all.yml
# (that file is gitignored upstream and exists only on the jumphost at
#  ~/repo/k3s-ansible; see docs/PLAN_NODE_HYGIENE.md §6).
# Secrets live in vault.yml (ansible-vault, password in .vault_pass on the jumphost).

k3s_version: v1.30.2+k3s2
apiserver_endpoint: 192.168.1.200
flannel_iface: eth0
system_timezone: "Europe/Stockholm"

# The master taint is applied by k3s-ansible when workers exist:
# node-role.kubernetes.io/master=true:NoSchedule
