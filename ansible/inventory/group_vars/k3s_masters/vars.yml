---
k3s_node_install_tls_sans:
  - 192.168.1.200
k3s_node_install_disabled_components:
  - servicelb
  - traefik
  - local-storage
k3s_node_install_taints:
  - node-role.kubernetes.io/master=true:NoSchedule
# Preserve the current control-plane snapshot setting; verify recovery separately.
k3s_node_install_server_settings:
  etcd-disable-snapshots: true
  etcd-snapshot-retention: 5
