---
# Storage Infrastructure Configuration
# ================================

# Storage Paths
storage:
  mount_base: /mnt/drives

# Encryption
encryption:
  keyfile: "{{ vault_storage_keyfile | default('') }}"

# Mount Options
mount:
  options:
    default: "defaults,noatime"
    encrypted: "defaults,noatime,discard"

# Explicit mergerfs allowlist. Keep rebuild_zl2pm4xc excluded while its
# backing filesystem is investigated.
merger_fs_mnt_branches:
  - /mnt/drives/automapped_46735ec9
  - /mnt/drives/automapped_6738a1a4
  - /mnt/drives/automapped_7075cbde
  - /mnt/drives/automapped_b06291e1
  - /mnt/drives/automapped_cd5c9477
  - /mnt/drives/automapped_ce3735fb
  - /mnt/drives/automapped_dcade560
  - /mnt/drives/rebuild_jehb7zbn

# RustFS S3 backup target. Secrets remain in the encrypted all-group vault.
rustfs_bind_address: 192.168.1.102
rustfs_data_dir: /mnt/storage/kubernetes/rustfs
rustfs_backup_bucket: linstor-backups
rustfs_backup_bucket_quota: 1T
rustfs_region: us-east-1
rustfs_root_access_key: "{{ vault_rustfs_root_access_key | default('') }}"
rustfs_root_secret_key: "{{ vault_rustfs_root_secret_key | default('') }}"
rustfs_backup_access_key: "{{ vault_rustfs_backup_access_key | default('') }}"
rustfs_backup_secret_key: "{{ vault_rustfs_backup_secret_key | default('') }}"

rustfs_backup_v2_access_key: "{{ vault_rustfs_backup_v2_access_key | default('') }}"
rustfs_backup_v2_secret_key: "{{ vault_rustfs_backup_v2_secret_key | default('') }}"

# Measured v2 retention plus growth allowance is 1,114,580,737,280 bytes.
# The 2T quota accommodates this on existing hardware; live filesystem gating
# separately reserves at least 1 TiB free on the mergerfs mount.
rustfs_backup_v2_bucket_quota: 2T

# Preserve the recovered OpenTofu backend and GitLab CI/package storage.
rustfs_gitlab_storage_enabled: true
rustfs_gitlab_access_key: "{{ vault_rustfs_gitlab_access_key }}"
rustfs_gitlab_secret_key: "{{ vault_rustfs_gitlab_secret_key }}"
rustfs_tofu_access_key: "{{ vault_rustfs_tofu_access_key }}"
rustfs_tofu_secret_key: "{{ vault_rustfs_tofu_secret_key }}"

# Dedicated GitLab Toolbox backup identity; provision before updating Flux Secret.
rustfs_gitlab_backup_identity_enabled: true
rustfs_gitlab_backup_access_key: "{{ vault_rustfs_gitlab_backup_access_key }}"
rustfs_gitlab_backup_secret_key: "{{ vault_rustfs_gitlab_backup_secret_key }}"

# Provision Registry identity before applying the Flux Registry Secret.
rustfs_registry_dedicated_identity_enabled: true
rustfs_registry_access_key: "{{ vault_rustfs_registry_access_key }}"
rustfs_registry_secret_key: "{{ vault_rustfs_registry_secret_key }}"
