---
# Network Storage Configuration
# ==========================

# Service Templates
services:
  templates:
    - copyparty
    # - nfs

# NFS Configuration
# geerlingguy.nfs expects complete export lines in nfs_exports.
# Keep root squashing for this shared export; media services use UID/GID 1000.
nfs_shared_uid: 1000
nfs_shared_gid: 1000
nfs_exports:
  - "{{ paths.storage }} *(rw,sync,fsid=0,crossmnt,no_subtree_check,root_squash,anonuid={{ nfs_shared_uid }},anongid={{ nfs_shared_gid }})"

# Samba Configuration
samba:
  shares:
    - name: public
      config: |
        [public]
        path = {{ paths.storage }}
        public = yes
        guest only = yes
        writable = yes
        force create mode = 0666
        force directory mode = 0777
        browseable = yes

# Maintenance Schedule
maintenance:
  schedule: "*-*-01 03:00:00"
