# Production Infrastructure Inventory
# ============================

# Global Variables
[all:vars]
ansible_connection=ssh
ansible_user=ubuntu

# Core Infrastructure Groups
# ========================

# Kubernetes Cluster
# Inventory names use the kubernetes-<octet>.local.hejsan.xyz DNS names
# (terraform/dns). k8s_node_name maps to the actual Kubernetes node name
# (== machine hostname) for drain/cordon/configz operations.
[k3s_cluster:children]
k3s_masters
k3s_nodes
k3s_gpu_node

[k3s_masters]
kubernetes-201.local.hejsan.xyz ansible_host=192.168.1.201 k3s_role=master k8s_node_name=kubernetes-master-201
kubernetes-202.local.hejsan.xyz ansible_host=192.168.1.202 k3s_role=master k8s_node_name=kubernetes-master-202
kubernetes-203.local.hejsan.xyz ansible_host=192.168.1.203 k3s_role=master k8s_node_name=kubernetes-master-203

[k3s_nodes]
kubernetes-204.local.hejsan.xyz ansible_host=192.168.1.204 k3s_role=node k8s_node_name=kubernetes-node-204
kubernetes-205.local.hejsan.xyz ansible_host=192.168.1.205 k3s_role=node k8s_node_name=kubernetes-node-205
kubernetes-206.local.hejsan.xyz ansible_host=192.168.1.206 k3s_role=node k8s_node_name=kubernetes-node-206

[k3s_masters:vars]
k3s_service_name=k3s

[k3s_nodes:vars]
k3s_service_name=k3s-node

# Storage Infrastructure
[storage_infrastructure:children]
storage_servers
storage_clients

[storage_servers]
storage.local.hejsan.xyz  ansible_host=192.168.1.102  storage_role=primary
192.168.1.213            storage_role=secondary  # hemmas

[storage_clients]
media.local.hejsan.xyz   ansible_host=192.168.1.105  storage_type=nfs,smb

# Media Services
[media_services]
media.local.hejsan.xyz   ansible_host=192.168.1.105
192.168.1.213  # hemmas - secondary media server

# Media Transcode Infrastructure & GPU Node
[jellyfin_transcode_servers]
gpu.local.hejsan.xyz  ansible_host=192.168.1.119

[k3s_gpu_node]
gpu.local.hejsan.xyz  ansible_host=192.168.1.119  k3s_role=gpu-node  k8s_node_name=ubuntu-ms-7977

[k3s_gpu_node:vars]
k3s_service_name=k3s-node

# 3D Printer Infrastructure
[printer_infrastructure:children]
printer_monitors
printer_cameras

[printer_monitors]
# Same physical host as k3s_gpu_node / gpu.local.hejsan.xyz -- single inventory
# entry to avoid double execution; monitor_type var kept for the obico role.
gpu.local.hejsan.xyz  ansible_host=192.168.1.119  monitor_type=obico

[printer_cameras]
printer-camera.localdomain  camera_type=mjpg-streamer

# Development Infrastructure
[development_infrastructure]
archlinux.localdomain ansible_user=jonas ansible_connection=local  # Override default user for development machine

# Dedicated Xorg gaming session hosts
[gaming_workstations]
archlinux.localdomain ansible_user=jonas ansible_connection=local  # Steam/Proton X11 session

# 3D Printing Workstations
[3d_printing_workstations]
archlinux.localdomain ansible_user=jonas ansible_connection=local  # Main 3D printing workstation

# Service Groups
# =============

# Docker and Container Services
[docker_hosts:children]
media_services
printer_infrastructure
storage_infrastructure
development_infrastructure

# File Sharing Services
[nfs_servers:children]
storage_servers

[nfs_clients:children]
media_services
development_infrastructure

[smb_servers:children]
storage_servers

# Aggregate Groups
# ===============

[all_servers:children]
k3s_cluster
storage_infrastructure
media_services
printer_infrastructure
development_infrastructure
gaming_workstations

# Local Development
[local]
localhost ansible_connection=local ansible_user=jonas