---
# Audit foundation for the tracked LUKS-to-plain-ext4 MergerFS migration.
#
# This first version is deliberately non-destructive. It never stops a
# service, writes a filesystem, changes fstab/crypttab, or formats a disk.
# Optional evidence output is the only remote write and must be explicitly
# enabled with mergerfs_unencrypted_write_audit=true.

- name: Audit the MergerFS unencrypted-disk migration prerequisites
  hosts: storage_servers
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    mergerfs_unencrypted_migration_phase: audit
    mergerfs_unencrypted_write_audit: false
    mergerfs_unencrypted_scan_oversized_files: false
    mergerfs_unencrypted_candidate: rebuild_jehb7zbn
    mergerfs_unencrypted_audit_id: ""
    mergerfs_unencrypted_audit_root: /var/lib/mergerfs-unencrypted-migration
    mergerfs_unencrypted_pool_mount: /mnt/storage
    mergerfs_unencrypted_proxmox_host: 192.168.1.100
    mergerfs_unencrypted_vmid: "101"
    mergerfs_unencrypted_expected_branches:
      - { name: rebuild_jehb7zbn, guest_serial: drive-scsi8, luks_uuid: 483af58b-f2c1-4236-9c73-a5c9a42d5e46, pool_member: true }
      - { name: automapped_b06291e1, guest_serial: drive-scsi11, luks_uuid: b06291e1-2bcd-46f5-a39a-fc1e88f56e34, pool_member: true }
      - { name: automapped_6738a1a4, guest_serial: drive-scsi12, luks_uuid: 6738a1a4-39ec-48ea-9d74-2b7a62a70f34, pool_member: true }
      - { name: automapped_7075cbde, guest_serial: drive-scsi5, luks_uuid: 7075cbde-2ced-4b76-a4df-352b423e4fc0, pool_member: true }
      - { name: automapped_cd5c9477, guest_serial: drive-scsi3, luks_uuid: cd5c9477-0b68-4658-afc8-cd4530059d84, pool_member: true }
      - { name: automapped_dcade560, guest_serial: drive-scsi10, luks_uuid: dcade560-de46-429a-b0de-efd4ff2a11c0, pool_member: true }
      - { name: automapped_46735ec9, guest_serial: drive-scsi7, luks_uuid: 46735ec9-edab-485e-88c1-4b5277d546df, pool_member: true }
      - { name: automapped_ce3735fb, guest_serial: drive-scsi6, luks_uuid: ce3735fb-e187-4ea5-b806-f7e8a2aa924e, pool_member: true }

  pre_tasks:
    - name: Restrict this release to the non-destructive audit phase
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_migration_phase == 'audit'
        fail_msg: >-
          This release implements only the audit phase. It cannot stop
          services, copy data, alter mounts, or format disks.

    - name: Require an audit ID when persisting evidence
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_audit_id | length > 0
          - mergerfs_unencrypted_audit_id is match('^[A-Za-z0-9._-]+$')
        fail_msg: >-
          Set a safe, non-empty mergerfs_unencrypted_audit_id when writing an
          audit bundle.
      when: mergerfs_unencrypted_write_audit | bool

  tasks:
    - name: Capture current pool source and filesystem type
      ansible.builtin.command:
        argv: [findmnt, --noheadings, --raw, --target, "{{ mergerfs_unencrypted_pool_mount }}", --output, "SOURCE,FSTYPE"]
      register: mergerfs_unencrypted_pool
      changed_when: false

    - name: Require the live MergerFS pool
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_pool.stdout is search('fuse.mergerfs')
        fail_msg: "{{ mergerfs_unencrypted_pool_mount }} is not an active MergerFS mount."

    - name: Capture branch capacity in bytes
      ansible.builtin.shell:
        cmd: df --block-size=1 --output=source,size,used,avail,target /mnt/drives/*
      register: mergerfs_unencrypted_df
      changed_when: false

    - name: Capture LUKS and mount topology
      ansible.builtin.command:
        argv: [lsblk, --json, --bytes, --output, "PATH,SERIAL,SIZE,FSTYPE,UUID,TYPE,PKNAME,MOUNTPOINTS"]
      register: mergerfs_unencrypted_lsblk
      changed_when: false

    - name: Capture persistent mount configuration without key material
      ansible.builtin.shell:
        cmd: >-
          awk '!/^($|#)/ {print $1, $2, $4}' /etc/crypttab;
          printf '%s\\n' '--- fstab ---';
          awk '!/^($|#)/ {print $1, $2, $3, $4}' /etc/fstab
      register: mergerfs_unencrypted_mount_config
      changed_when: false

    - name: Read VM 101 raw-disk configuration from Proxmox
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - "root@{{ mergerfs_unencrypted_proxmox_host }}"
          - qm
          - config
          - "{{ mergerfs_unencrypted_vmid }}"
      delegate_to: localhost
      become: false
      register: mergerfs_unencrypted_vm_config
      changed_when: false

    - name: Require nine unique raw disk assignments in VM 101
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_vm_config.stdout_lines | select('match', '^scsi[0-9]+: /dev/disk/by-id/') | list | length == mergerfs_unencrypted_expected_branches | length
        fail_msg: >-
          VM 101 does not expose exactly the expected number of direct
          /dev/disk/by-id data disks. No migration phase may proceed.

    - name: Require every expected LUKS UUID to be visible
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_lsblk.stdout is search(item.luks_uuid)
          - mergerfs_unencrypted_lsblk.stdout is search(item.guest_serial)
        fail_msg: >-
          {{ item.name }} does not match both its expected LUKS UUID and guest
          SCSI serial. No migration phase may proceed.
      loop: "{{ mergerfs_unencrypted_expected_branches }}"

    - name: Require ZL2 to remain outside the migration inventory and live pool
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_pool.stdout is not search('rebuild_zl2pm4xc')
          - mergerfs_unencrypted_pool.stdout is search('rebuild_jehb7zbn')
        fail_msg: >-
          ZL2 must remain excluded while JEHB remains in the current live pool.

    - name: Calculate source-excluded staging capacity for selected candidate
      ansible.builtin.shell:
        cmd: |
          set -eu
          stage_available=0
          while read -r source size used avail target; do
            case "$target" in
              /mnt/drives/*)
                if [ "${target#/mnt/drives/}" = "{{ mergerfs_unencrypted_candidate }}" ]; then
                  candidate_used="$used"
                elif [ "${target#/mnt/drives/}" != "rebuild_zl2pm4xc" ]; then
                  stage_available=$((stage_available + avail))
                fi
                ;;
            esac
          done <<'EOF'
          {{ mergerfs_unencrypted_df.stdout }}
          EOF
          candidate_used="${candidate_used:-0}"
          required=$((candidate_used * 110 / 100))
          printf 'candidate={{ mergerfs_unencrypted_candidate }}\\ncandidate_used=%s\\nstage_available=%s\\nrequired_with_headroom=%s\\n' "$candidate_used" "$stage_available" "$required"
        executable: /bin/bash
      register: mergerfs_unencrypted_capacity
      changed_when: false

    - name: Require sufficient source-excluded capacity for selected candidate
      ansible.builtin.assert:
        that:
          - (mergerfs_unencrypted_capacity.stdout | regex_search('stage_available=([0-9]+)', '\\1') | first | int) >= (mergerfs_unencrypted_capacity.stdout | regex_search('required_with_headroom=([0-9]+)', '\\1') | first | int)
        fail_msg: >-
          Other eligible filesystems do not have enough capacity for this
          candidate plus 10 percent headroom.

    - name: Find selected-branch files larger than every staging filesystem
      ansible.builtin.shell:
        cmd: |
          set -eu
          find "/mnt/drives/{{ mergerfs_unencrypted_candidate }}" -xdev -type f -size +5900G -printf '%s %p\\n'
        executable: /bin/bash
      register: mergerfs_unencrypted_oversized_files
      changed_when: false
      when: mergerfs_unencrypted_scan_oversized_files | bool

    - name: Require no file larger than a staging filesystem
      ansible.builtin.assert:
        that:
          - mergerfs_unencrypted_oversized_files.stdout | trim | length == 0
        fail_msg: >-
          At least one file is larger than a single eligible staging
          filesystem; choose another distribution strategy.
      when: mergerfs_unencrypted_scan_oversized_files | bool

    - name: Show migration audit summary
      ansible.builtin.debug:
        msg:
          pool: "{{ mergerfs_unencrypted_pool.stdout }}"
          capacity: "{{ mergerfs_unencrypted_capacity.stdout_lines }}"
          candidate: "{{ mergerfs_unencrypted_candidate }}"
          branches: "{{ mergerfs_unencrypted_expected_branches | map(attribute='name') | list }}"

    - name: Create the persistent audit directory
      ansible.builtin.file:
        path: "{{ mergerfs_unencrypted_audit_root }}/{{ mergerfs_unencrypted_audit_id }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: mergerfs_unencrypted_write_audit | bool

    - name: Persist sanitized audit evidence
      ansible.builtin.copy:
        dest: "{{ mergerfs_unencrypted_audit_root }}/{{ mergerfs_unencrypted_audit_id }}/{{ item.name }}.txt"
        owner: root
        group: root
        mode: '0600'
        content: "{{ item.content }}"
      loop:
        - { name: pool, content: "{{ mergerfs_unencrypted_pool.stdout }}\\n" }
        - { name: capacity, content: "{{ mergerfs_unencrypted_capacity.stdout }}" }
        - { name: lsblk, content: "{{ mergerfs_unencrypted_lsblk.stdout }}\\n" }
        - { name: mounts, content: "{{ mergerfs_unencrypted_mount_config.stdout }}\\n" }
        - { name: vm-101, content: "{{ mergerfs_unencrypted_vm_config.stdout }}\\n" }
      no_log: true
      when: mergerfs_unencrypted_write_audit | bool
