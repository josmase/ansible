---
# Add the dedicated low-risk worker without running server-side cluster setup
# or reapplying K3s static add-ons.
- name: Set up the Kubernetes worker agent
  hosts: kubernetes-214.local.hejsan.xyz
  become: true
  gather_facts: true
  any_errors_fatal: true
  environment: "{{ proxy_env | default({}) }}"
  pre_tasks:
    - name: Confirm this inventory host is configured as a worker
      ansible.builtin.assert:
        that:
          - k3s_role == 'node'
          - k8s_node_name == 'kubernetes-node-214'
        fail_msg: This playbook is only for the configured 192.168.1.214 worker.
    - name: Set DNS resolvers for worker image pulls
      ansible.builtin.copy:
        dest: /etc/netplan/60-k3s-worker-dns.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              {{ flannel_iface }}:
                dhcp4-overrides:
                  use-dns: false
                nameservers:
                  addresses:
          {% for dns_server in k3s_worker_dns_servers %}
                    - {{ dns_server }}
          {% endfor %}
      register: worker_dns_config
    - name: Apply worker DNS configuration
      ansible.builtin.command:
        cmd: netplan apply
      when: worker_dns_config.changed
  roles:
    - role: prereq
      become: true
    - role: download
      become: true
    - role: k3s_agent
      become: true
