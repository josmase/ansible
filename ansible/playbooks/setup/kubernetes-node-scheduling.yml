---
- name: Reconcile scheduling policy for diskless Kubernetes workers
  hosts: k3s_masters
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Verify all LINSTOR storage pools exclude replica-disabled nodes
      ansible.builtin.shell: |
        set -o pipefail
        /usr/local/bin/k3s kubectl get linstorsatelliteconfigurations.piraeus.io -o json |
          python3 -c 'import json,sys; d=json.load(sys.stdin); pools=[(r["metadata"]["name"],r.get("spec",{}).get("nodeAffinity",{}).get("nodeSelectorTerms",[])) for r in d.get("items",[]) if r.get("spec",{}).get("storagePools")]; bad=[name for name,terms in pools if not terms or any(not any(e.get("key")=="storage.josmase.io/replicas-disabled" and e.get("operator")=="DoesNotExist" for e in t.get("matchExpressions",[])) for t in terms)]; print("All LINSTOR storage pools exclude replica-disabled nodes" if pools and not bad else "Unsafe LINSTOR storage-pool selectors: " + ", ".join(bad or ["no storage-pool configuration found"])); sys.exit(bool(bad or not pools))'
      args:
        executable: /bin/bash
      register: diskless_pool_policy
      changed_when: false

    - name: Add the diskless replica-exclusion label to node 213
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - label
          - node
          - kubernetes-node-213
          - storage.josmase.io/replicas-disabled=true
          - --overwrite
      register: node_213_replica_label
      changed_when: "' labeled' in node_213_replica_label.stdout and 'not labeled' not in node_213_replica_label.stdout"

    - name: Remove the full LINSTOR exclusion label from node 213
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - label
          - node
          - kubernetes-node-213
          - storage.josmase.io/linstor-disabled-
      register: node_213_linstor_label
      failed_when: node_213_linstor_label.rc != 0 and 'not found' not in node_213_linstor_label.stderr
      changed_when: node_213_linstor_label.rc == 0

    - name: Wait for node 213's diskless LINSTOR satellite to become available
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - linstorsatellite.piraeus.io
          - kubernetes-node-213
          - -n
          - piraeus-datastore
          - -o
          - json
      register: node_213_satellite
      changed_when: false
      until: >-
        node_213_satellite.rc == 0 and
        ((node_213_satellite.stdout | from_json).status.conditions | selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'True') | list | length) == 1 and
        ((node_213_satellite.stdout | from_json).status.conditions | selectattr('type', 'equalto', 'Configured') | selectattr('status', 'equalto', 'True') | list | length) == 1
      retries: 60
      delay: 5

    - name: Read local-storage configuration placement
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - linstorsatelliteconfiguration.piraeus.io
          - "{{ item }}"
          - -o
          - json
      loop:
        - standard-worker-storage
        - final-lvm-thin-storage
      register: node_213_storage_configs
      changed_when: false

    - name: Confirm node 213 is excluded from every local storage pool configuration
      ansible.builtin.assert:
        that:
          - "((item.stdout | from_json).status.conditions | selectattr('type', 'equalto', 'Applied') | selectattr('status', 'equalto', 'True') | list | length) == 1"
          - "((item.stdout | from_json).status.conditions | selectattr('type', 'equalto', 'Applied') | map(attribute='observedGeneration') | first | int) == ((item.stdout | from_json).metadata.generation | int)"
          - (item.stdout | from_json).status.appliedTo is defined
          - "'kubernetes-node-213' not in ((item.stdout | from_json).status.appliedTo | default([]))"
        fail_msg: "Node 213 was selected by local storage configuration {{ item.item }}."
      loop: "{{ node_213_storage_configs.results }}"
