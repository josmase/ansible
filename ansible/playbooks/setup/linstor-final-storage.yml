---
- name: Initialize guarded permanent LINSTOR disks
  hosts: linstor_final_nodes
  become: true
  serial: 1
  vars:
    linstor_lvm_expected_serial: "linstor-data-{{ k8s_node_name | regex_replace('^kubernetes-node-', '') }}"
    linstor_lvm_expected_size_bytes: 805306368000
    linstor_lvm_vg_name: linstor_vg
    linstor_lvm_thinpool_name: linstor_thin
    linstor_lvm_thinpool_size: "{{ linstor_final_thinpool_sizes[k8s_node_name | regex_replace('^kubernetes-node-', '')] }}"
    linstor_final_thinpool_sizes:
      "204": 680g
      "205": 760g
      "206": 840g
    linstor_lvm_remove_extra_pvs: false
    linstor_lvm_autoextend_threshold: 75
    linstor_lvm_autoextend_percent: 5
    linstor_lvm_thinpool_metadata_size: 4g
  roles:
    - role: storage/linstor_lvm
