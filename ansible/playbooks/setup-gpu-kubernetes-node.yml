---
# Playbook to setup GPU-enabled Kubernetes node
# Installs NVIDIA drivers, container toolkit, and prepares node for GPU workloads
# Note: This playbook assumes the node is already joined to the k3s cluster
# The GPU node remains untainted for general scheduling. GPU consumers are
# pinned with the gpu=true label; LINSTOR must keep it diskless-only.

- name: "Setup GPU-enabled Kubernetes Node"
  hosts: "k3s_gpu_node"
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Display node information"
      debug:
        msg: |
          Setting up GPU node: {{ inventory_hostname }}
          IP Address: {{ ansible_default_ipv4.address }}
          Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel: {{ ansible_kernel }}

    - name: "Verify node is already joined to k3s cluster"
      shell: |
        if [ -f /usr/local/bin/k3s ]; then
          echo "k3s is installed"
          exit 0
        else
          echo "ERROR: k3s is not installed. Node must be joined to the cluster first"
          exit 1
        fi
      changed_when: false
      ignore_errors: true
      register: k3s_check

    - name: "Fail if k3s not installed"
      fail:
        msg: |
          GPU node {{ inventory_hostname }} does not have k3s installed.
          
          Configure the node inventory and use the K3s worker onboarding
          playbook with a single-host limit. Verify the node is Ready, then
          re-run this GPU setup playbook.
      when: k3s_check.rc != 0

    - name: "Install kubernetes Python library for node management"
      pip:
        name: kubernetes
        state: present
        executable: pip3
        extra_args: "--break-system-packages"
      become: true

  roles:
    - name: "core/base_setup"
      description: "Run standard base system setup"
      
    - name: "platform/kubernetes"
      description: "Configure Kubernetes-specific settings (multipath, nvme, etc.)"
      
    - name: "platform/kubernetes_gpu_setup"
      description: "Install and configure NVIDIA GPU drivers and container runtime"
      vars:
        gpu_enable: true
        gpu_type: "nvidia"

  post_tasks:
    - name: "Retrieve GPU setup verification report"
      slurp:
        src: /var/log/gpu-setup-verification.txt
      register: gpu_verification_report
      ignore_errors: true

    - name: "Display GPU setup summary"
      debug:
        msg: "{{ gpu_verification_report.content | b64decode }}"
      when: gpu_verification_report is succeeded
      ignore_errors: true

    - name: "Create .kube directory on GPU node"
      tags:
        - gpu_node_scheduling
      file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0755'

    - name: "Fetch kubeconfig from master node"
      tags:
        - gpu_node_scheduling
      slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_content
      delegate_to: "{{ groups['k3s_masters'][0] }}"
      become: true

    - name: "Copy kubeconfig to GPU node"
      tags:
        - gpu_node_scheduling
      copy:
        content: "{{ kubeconfig_content.content | b64decode | regex_replace('127.0.0.1:6443', hostvars[groups['k3s_masters'][0]].ansible_host + ':6443') }}"
        dest: "{{ ansible_env.HOME }}/.kube/config"
        mode: '0600'

    - name: "Label GPU node for pinned GPU workloads"
      tags:
        - gpu_node_scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - "{{ ansible_env.HOME }}/.kube/config"
          - label
          - node
          - "{{ ansible_hostname | lower }}"
          - gpu=true
          - node.kubernetes.io/storage-tier=low
          - storage.josmase.io/replicas-disabled=true
          - --overwrite
      register: gpu_node_labels
      changed_when: "' labeled' in gpu_node_labels.stdout and 'not labeled' not in gpu_node_labels.stdout"

    - name: "Remove the obsolete GPU-only taint"
      tags:
        - gpu_node_scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - "{{ ansible_env.HOME }}/.kube/config"
          - taint
          - node
          - "{{ ansible_hostname | lower }}"
          - workload=gpu-only:NoSchedule-
      register: gpu_node_taint
      failed_when: gpu_node_taint.rc != 0 and 'not found' not in gpu_node_taint.stderr
      changed_when: "'untainted' in gpu_node_taint.stdout"

    - name: "Prefer ordinary workloads on other nodes while keeping GPU scheduling available"
      tags:
        - gpu_node_scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - "{{ ansible_env.HOME }}/.kube/config"
          - taint
          - node
          - "{{ ansible_hostname | lower }}"
          - gpu.josmase.io/workload=gpu:PreferNoSchedule
          - --overwrite
      register: gpu_node_preferred_taint
      changed_when: "'tainted' in gpu_node_preferred_taint.stdout and 'not tainted' not in gpu_node_preferred_taint.stdout"

    - name: "Read the GPU node's advertised shared capacity"
      tags:
        - gpu_node_scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - "{{ ansible_env.HOME }}/.kube/config"
          - get
          - node
          - "{{ ansible_hostname | lower }}"
          - -o
          - json
      register: gpu_node_capacity
      changed_when: false

    - name: "Refresh NVIDIA device-plugin registration when no shared GPU is advertised"
      tags:
        - gpu_node_scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - "{{ ansible_env.HOME }}/.kube/config"
          - rollout
          - restart
          - daemonset/nvidia-device-plugin
          - -n
          - nvidia-device-plugin
      register: gpu_plugin_refresh
      changed_when: "'restarted' in gpu_plugin_refresh.stdout"
      when: (gpu_node_capacity.stdout | from_json).status.allocatable.get('nvidia.com/gpu.shared', '0') | int == 0

    - name: "Wait for the GPU node to advertise a shared GPU slot"
      tags:
        - gpu_node_scheduling
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig
          - "{{ ansible_env.HOME }}/.kube/config"
          - get
          - node
          - "{{ ansible_hostname | lower }}"
          - -o
          - json
      register: gpu_node_capacity_after_refresh
      changed_when: false
      until: (gpu_node_capacity_after_refresh.stdout | from_json).status.allocatable.get('nvidia.com/gpu.shared', '0') | int >= 1
      retries: 30
      delay: 10

    - name: "Display node readiness check"
      shell: |
        echo "Node Status:"
        systemctl status containerd || echo "Containerd status check skipped"
        echo ""
        echo "GPU Setup Complete! Next steps:"
        echo "1. Verify gpu=true and gpu.josmase.io/workload=gpu:PreferNoSchedule: kubectl get node {{ ansible_hostname | lower }} -o yaml"
        echo "2. Verify NVIDIA Device Plugin: kubectl get pods -n nvidia-device-plugin -o wide"
        echo "3. GPU consumers select gpu=true and tolerate the soft taint; other workloads may still schedule here when needed."
        echo "4. Verify GPU access: kubectl exec -n media -it <jellyfin-pod> -- nvidia-smi"
        echo "5. Keep this node diskless-only in LINSTOR: no local pools or diskful replicas."
      register: node_status
      changed_when: false

    - name: "Print next steps"
      debug:
        msg: "{{ node_status.stdout }}"
