---
- name: Create logrotate configuration for Docker containers
  become: true
  ansible.builtin.template:
    src: logrotate-docker.j2
    dest: /etc/logrotate.d/docker-containers
    mode: "0644"
    owner: root
    group: root
  when: logging_docker_enabled | bool
  tags:
    - logging
    - logrotate
    - docker

- name: Create logrotate configuration for UniFi
  become: true
  ansible.builtin.template:
    src: logrotate-unifi.j2
    dest: /etc/logrotate.d/unifi
    mode: "0644"
    owner: root
    group: root
  when: logging_unifi_logrotate_enabled | bool
  tags:
    - logging
    - logrotate
    - unifi

- name: Create logrotate configuration for additional services
  become: true
  ansible.builtin.template:
    src: logrotate-custom.j2
    dest: "/etc/logrotate.d/{{ item.name | default('custom-' + (item.path | basename)) }}"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ logging_additional_log_paths }}"
  when:
    - logging_logrotate_enabled | bool
    - logging_additional_log_paths | length > 0
  tags:
    - logging
    - logrotate

- name: Configure logrotate timer schedule
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: logging_logrotate_timer_override_enabled | bool
  tags:
    - logging
    - logrotate

- name: Write logrotate timer schedule override
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/logrotate.timer.d/ansible-override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (core/logging_setup).
      [Timer]
      OnCalendar=
      OnCalendar={{ logging_logrotate_timer_schedule }}
      AccuracySec=5m
      Persistent=true
  when: logging_logrotate_timer_override_enabled | bool
  notify: Restart logrotate timer
  tags:
    - logging
    - logrotate

- name: Remove logrotate timer override when disabled
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d/ansible-override.conf
    state: absent
  when: not (logging_logrotate_timer_override_enabled | bool)
  notify: Restart logrotate timer
  tags:
    - logging
    - logrotate
