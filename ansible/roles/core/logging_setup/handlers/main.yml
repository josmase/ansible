---
- name: Restart journald
  become: true
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
    daemon_reload: true

- name: Restart docker
  become: true
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Restart logrotate timer
  become: true
  ansible.builtin.systemd:
    name: logrotate.timer
    state: restarted
    enabled: true
    daemon_reload: true
