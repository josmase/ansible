---
# Tasks for managing Docker container deployments

- name: Identify existing Docker Compose templates
  find:
    paths: "{{ docker_compose_dir }}"
    patterns: "*.yml"
  register: existing_docker_templates
  tags:
    - docker
    - templates

- name: Remove outdated Docker Compose templates
  file:
    path: "{{ item['path'] }}"
    state: absent
  with_items: "{{ existing_docker_templates['files'] }}"
  tags:
    - docker
    - templates
    - cleanup

- name: Deploy Docker Compose templates
  template:
    src: "compose/{{ item }}.yml"
    dest: "{{ docker_compose_dir }}/{{ item }}.yml"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0640"
  loop: "{{ services.templates }}"
  register: compose_templates
  tags:
    - docker
    - templates
    - deploy

- name: Set fact for supporting files to deploy
  set_fact:
    support_files_to_deploy: "{{ ['unifi-init-mongo.sh'] if 'unifi' in services.templates else [] }}"

- name: Deploy supporting files
  template:
    src: "extra-files/{{ item }}"
    dest: "{{ docker_compose_dir }}/{{ item }}"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0644"
  loop: "{{ support_files_to_deploy }}"
  tags:
    - docker
    - templates
    - support
- name: Ensure Transmission config directory exists
  file:
    path: "{{ docker_data_dir }}/transmission"
    state: directory
    owner: "{{ docker_puid }}"
    group: "{{ docker_pgid }}"
    mode: "0755"
  when: "'transmission' in services.templates"

- name: Ensure Transmission download directories exist
  file:
    path: "{{ docker_storage_dir }}/downloads/{{ item }}"
    state: directory
    owner: "{{ docker_puid }}"
    group: "{{ docker_pgid }}"
    mode: "0755"
  loop:
    - complete
    - incomplete
    - watch
  when: "'transmission' in services.templates"

- templates'"

- name: Deploy Transmission settings.json
  template:
    src: "transmission-settings.json.j2"
    dest: "{{ docker_data_dir }}/transmission/settings.json"
    owner: "{{ docker_puid }}"
    group: "{{ docker_pgid }}"
    mode: "0644"
  when: "'transmission' in services.templates"
- name: Start container services
  command: "{{ docker_script_dir }}/start.sh"
  when: compose_templates.changed
  tags:
    - docker
    - service
    - start
