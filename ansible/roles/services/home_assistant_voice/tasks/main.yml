---
- name: Require a Home Assistant API token
  ansible.builtin.assert:
    that:
      - home_assistant_token is defined
      - home_assistant_token | length > 20
    fail_msg: >-
      Set vault_homeassistant_token in inventory/group_vars/all/vault.yml before
      running the Home Assistant voice setup.
  no_log: true

- name: Wait for Kubernetes Wyoming Whisper TCP route
  ansible.builtin.wait_for:
    host: "{{ home_assistant_voice_stt_host }}"
    port: "{{ home_assistant_voice_stt_port }}"
    timeout: 15
    state: started
  delegate_to: localhost

- name: Wait for Kubernetes Wyoming Piper TCP route
  ansible.builtin.wait_for:
    host: "{{ home_assistant_voice_tts_host }}"
    port: "{{ home_assistant_voice_tts_port }}"
    timeout: 15
    state: started
  delegate_to: localhost

- name: Wait for Kubernetes Wyoming Kokoro TCP route
  ansible.builtin.wait_for:
    host: "{{ home_assistant_voice_english_tts_host }}"
    port: "{{ home_assistant_voice_english_tts_port }}"
    timeout: 15
    state: started
  delegate_to: localhost

- name: Configure Home Assistant local voice
  ansible.builtin.command:
    argv:
      - timeout
      - "90"
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/configure.py"
      - --url
      - "{{ home_assistant_url }}"
      - --ollama-url
      - "{{ home_assistant_ollama_url }}"
      - --ollama-model
      - "{{ home_assistant_ollama_model }}"
      - --pipeline-name
      - "{{ home_assistant_voice_pipeline_name }}"
      - --conversation-name
      - "{{ home_assistant_voice_conversation_name }}"
      - --language
      - "{{ home_assistant_voice_language }}"
      - --conversation-language
      - "{{ home_assistant_voice_language }}"
      - --stt-host
      - "{{ home_assistant_voice_stt_host }}"
      - --stt-port
      - "{{ home_assistant_voice_stt_port }}"
      - --stt-language
      - "{{ home_assistant_voice_stt_language }}"
      - --tts-host
      - "{{ home_assistant_voice_tts_host }}"
      - --tts-port
      - "{{ home_assistant_voice_tts_port }}"
      - --tts-language
      - "{{ home_assistant_voice_tts_language }}"
      - --tts-voice
      - "{{ home_assistant_voice_tts_voice }}"
      - --tts-provider
      - piper
  environment:
    HOME_ASSISTANT_TOKEN: "{{ home_assistant_token }}"
    HOME_ASSISTANT_VERIFY_SSL: "{{ home_assistant_verify_ssl | string }}"
    HOME_ASSISTANT_CONFIGURE_INTEGRATIONS: "{{ home_assistant_voice_configure_integrations | string }}"
    HOME_ASSISTANT_CONFIGURE_PIPELINE: "{{ home_assistant_voice_configure_pipeline | string }}"
    NO_PROXY: "homeassistant.local,homeassistant.local.hejsan.xyz,ollama.local.hejsan.xyz,wyoming-whisper.local.hejsan.xyz,wyoming-piper.local.hejsan.xyz,wyoming-kokoro.local.hejsan.xyz,gpu.local.hejsan.xyz"
    no_proxy: "homeassistant.local,homeassistant.local.hejsan.xyz,ollama.local.hejsan.xyz,wyoming-whisper.local.hejsan.xyz,wyoming-piper.local.hejsan.xyz,wyoming-kokoro.local.hejsan.xyz,gpu.local.hejsan.xyz"
  register: home_assistant_voice_configure
  changed_when: >-
    'changed' in (home_assistant_voice_configure.stdout | lower)
  no_log: true

- name: Configure Home Assistant Swedish-to-English voice pipeline
  ansible.builtin.command:
    argv:
      - timeout
      - "90"
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/configure.py"
      - --url
      - "{{ home_assistant_url }}"
      - --ollama-url
      - "{{ home_assistant_ollama_url }}"
      - --ollama-model
      - "{{ home_assistant_ollama_model }}"
      - --pipeline-name
      - "{{ home_assistant_voice_english_pipeline_name }}"
      - --conversation-name
      - "{{ home_assistant_voice_conversation_name }}"
      - --language
      - "{{ home_assistant_voice_english_language }}"
      - --conversation-language
      - "{{ home_assistant_voice_english_conversation_language }}"
      - --stt-host
      - "{{ home_assistant_voice_stt_host }}"
      - --stt-port
      - "{{ home_assistant_voice_stt_port }}"
      - --stt-language
      - "{{ home_assistant_voice_english_stt_language }}"
      - --tts-host
      - "{{ home_assistant_voice_english_tts_host }}"
      - --tts-port
      - "{{ home_assistant_voice_english_tts_port }}"
      - --tts-language
      - "{{ home_assistant_voice_english_tts_language }}"
      - --tts-voice
      - "{{ home_assistant_voice_english_tts_voice }}"
      - --tts-provider
      - kokoro
      - --prefer-local-intents
      - "{{ home_assistant_voice_english_prefer_local_intents | string }}"
  environment:
    HOME_ASSISTANT_TOKEN: "{{ home_assistant_token }}"
    HOME_ASSISTANT_VERIFY_SSL: "{{ home_assistant_verify_ssl | string }}"
    HOME_ASSISTANT_CONFIGURE_INTEGRATIONS: "{{ home_assistant_voice_configure_integrations | string }}"
    HOME_ASSISTANT_CONFIGURE_PIPELINE: "{{ home_assistant_voice_configure_pipeline | string }}"
    NO_PROXY: "homeassistant.local,homeassistant.local.hejsan.xyz,ollama.local.hejsan.xyz,wyoming-whisper.local.hejsan.xyz,wyoming-piper.local.hejsan.xyz,wyoming-kokoro.local.hejsan.xyz,gpu.local.hejsan.xyz"
    no_proxy: "homeassistant.local,homeassistant.local.hejsan.xyz,ollama.local.hejsan.xyz,wyoming-whisper.local.hejsan.xyz,wyoming-piper.local.hejsan.xyz,wyoming-kokoro.local.hejsan.xyz,gpu.local.hejsan.xyz"
  register: home_assistant_voice_english_configure
  changed_when: >-
    'changed' in (home_assistant_voice_english_configure.stdout | lower)
  no_log: true
