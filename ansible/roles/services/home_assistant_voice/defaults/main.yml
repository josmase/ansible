---
# Home Assistant local voice configuration.

home_assistant_url: "http://homeassistant.local.hejsan.xyz:8123"
home_assistant_token: "{{ vault_homeassistant_token }}"
home_assistant_verify_ssl: true

home_assistant_voice_language: sv
home_assistant_voice_pipeline_name: Local Swedish
home_assistant_voice_conversation_name: Local Qwen3 Swedish
home_assistant_voice_english_conversation_name: Local Qwen3 English
home_assistant_voice_english_conversation_prompt: >-
  You are a Home Assistant voice assistant. Always answer in English, even when
  the user speaks Swedish. Output English only, even if the input and tool
  result are Swedish. Return exactly one concise sentence. Do not say "Got it"
  or add an offer to help. Use tools for current time, date, and home state.
  Always use the actual values returned by the tool; never
  output placeholder text such as "value from tool" and never reveal reasoning
  or internal tool details.
home_assistant_voice_stt_host: wyoming-whisper.local.hejsan.xyz
home_assistant_voice_stt_port: 10300
home_assistant_voice_stt_language: sv
home_assistant_voice_tts_host: wyoming-piper.local.hejsan.xyz
home_assistant_voice_tts_port: 10200
home_assistant_voice_tts_language: sv_SE
home_assistant_voice_tts_voice: sv_SE-alma-medium

home_assistant_voice_english_pipeline_name: Local Swedish to English
home_assistant_voice_english_language: en
home_assistant_voice_english_conversation_language: en
home_assistant_voice_english_stt_language: sv
home_assistant_voice_english_tts_host: wyoming-kokoro.local.hejsan.xyz
home_assistant_voice_english_tts_port: 10201
home_assistant_voice_english_tts_language: en-us
home_assistant_voice_english_tts_voice: af_heart
home_assistant_voice_english_prefer_local_intents: true
home_assistant_voice_max_history: 5
home_assistant_voice_english_max_history: 1

home_assistant_ollama_url: "https://ollama.local.hejsan.xyz"
home_assistant_ollama_model: ha-qwen3-4b-instruct:2507-q4km
home_assistant_voice_configure_integrations: true
home_assistant_voice_configure_pipeline: true
home_assistant_voice_cleanup_legacy: true

# Staged rollout: the old English flow remains active until router validation.
home_assistant_voice_router_enabled: true
home_assistant_voice_router_promote: false
home_assistant_voice_router_model: ha-qwen3-4b-instruct:2507-q4km
home_assistant_voice_router_archive_url: >-
  https://gitlab.local.hejsan.xyz/api/v4/projects/39/packages/generic/bilingual-assist/v0.2.0/bilingual_assist_v2.zip
home_assistant_voice_router_archive_sha256: 01bf7cca062e4b2aa76072cda5ad5207b50ec465c2c58992d5a9a3ecf7465a31
home_assistant_voice_router_download_headers:
  Deploy-Token: "{{ vault_home_assistant_voice_router_package_token | default('') }}"
home_assistant_voice_router_ssh_port: 2222
home_assistant_voice_router_ssh_public_key_file: /home/ubuntu/.ssh/id_rsa.pub
# Retrieved through the authenticated Supervisor terminal, not an unverified scan.
home_assistant_voice_router_ssh_host_key: >-
  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICb2g0xd9kcl+dNIKYYf8+LUjHtN+DFr5a3UkYXNTeSt
home_assistant_voice_router_work_dir: /home/ubuntu/.local/state/home-assistant-voice
home_assistant_voice_router_acceptance_file: ""
# Absolute path on the Ansible execution host. Required even for staging:
# records the exact model, images, and non-secret configuration being evaluated.
home_assistant_voice_router_release_manifest: >-
  {{ role_path }}/files/router-release-v0.2.1.json
home_assistant_voice_router_cleanup_owned: false
home_assistant_voice_router_ownership_file: ""
home_assistant_voice_router_search_password: "{{ vault_home_assistant_voice_search_password | default('') }}"
