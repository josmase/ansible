---
rustfs_image: "rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587"
rustfs_cli_image: "rustfs/rc@sha256:9f4e5cd6e43576f2daaa5f6338827ef8296f5eb781175950b0bf62c92e983686"
rustfs_compose_dir: /opt/rustfs
rustfs_secret_dir: /etc/rustfs
rustfs_data_dir: /mnt/storage/kubernetes/rustfs
rustfs_bind_address: 127.0.0.1
rustfs_api_port: 9000
rustfs_console_port: 9001
rustfs_uid: 10001
rustfs_gid: 10001
rustfs_required_mount: /mnt/storage
rustfs_required_fstype: fuse.mergerfs
rustfs_minimum_free_bytes: 1099511627776
rustfs_region: us-east-1
rustfs_backup_bucket: linstor-backups
rustfs_backup_bucket_quota: 1T
rustfs_backup_policy: linstor-backups
rustfs_backup_v2_bucket: linstor-backups-v2
rustfs_backup_v2_bucket_quota: 1T
rustfs_backup_v2_policy: linstor-backups-v2
rustfs_root_access_key: ""
rustfs_root_secret_key: ""
rustfs_backup_access_key: ""
rustfs_backup_secret_key: ""
rustfs_backup_v2_access_key: ""
rustfs_backup_v2_secret_key: ""

# Optional GitLab object storage and dedicated OpenTofu state storage.
rustfs_gitlab_storage_enabled: false
rustfs_gitlab_access_key: ""
rustfs_gitlab_secret_key: ""
rustfs_tofu_access_key: ""
rustfs_tofu_secret_key: ""
rustfs_gitlab_buckets:
  - gitlab-artifacts
  - gitlab-lfs
  - gitlab-uploads
  - gitlab-packages
  - gitlab-terraform-state
rustfs_gitlab_backup_buckets: [gitlab-backups-tmp, gitlab-backups]
rustfs_gitlab_policy: gitlab-ci-artifacts-packages
rustfs_tofu_state_bucket: gitlab-terraform-state
rustfs_tofu_policy: gitlab-terraform-state
rustfs_registry_access_key: "{{ rustfs_gitlab_access_key }}"
rustfs_registry_secret_key: "{{ rustfs_gitlab_secret_key }}"
rustfs_registry_bucket: linstor-backups
rustfs_registry_rootdirectory: /gitlab-registry
rustfs_registry_policy: gitlab-container-registry

rustfs_capacity_report_key: __protection/capacity.json
rustfs_capacity_report_interval: 5min
