---
- name: Require an exact K3s target for version validation
  ansible.builtin.assert:
    that:
      - k3s_upgrade_target_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')

- name: Read the installed K3s version
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, --version]
  register: k3s_upgrade_installed_version
  changed_when: false
  check_mode: false

- name: Extract the installed K3s release
  ansible.builtin.set_fact:
    k3s_upgrade_current_version: >-
      {{ k3s_upgrade_installed_version.stdout
         | regex_search('(?m)^k3s version v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+(?=\s|$)')
         | default('', true) | replace('k3s version ', '') }}

- name: Refuse an unrecognized installed release
  ansible.builtin.assert:
    that:
      - k3s_upgrade_current_version | length > 0
    fail_msg: "Cannot safely compare the installed K3s release: {{ k3s_upgrade_installed_version.stdout }}"

- name: Parse numeric K3s release components including the build number
  ansible.builtin.set_fact:
    k3s_upgrade_current_components: "{{ k3s_upgrade_current_version | replace('+k3s', '.') | regex_findall('[0-9]+') | map('int') | list }}"
    k3s_upgrade_target_components: "{{ k3s_upgrade_target_version | replace('+k3s', '.') | regex_findall('[0-9]+') | map('int') | list }}"

- name: Refuse downgrades and skipped Kubernetes minor releases
  ansible.builtin.assert:
    that:
      - k3s_upgrade_target_components >= k3s_upgrade_current_components
      - k3s_upgrade_target_components[0] == k3s_upgrade_current_components[0]
      - k3s_upgrade_target_components[1] <= k3s_upgrade_current_components[1] + 1
    fail_msg: >-
      Refusing {{ k3s_upgrade_current_version }} -> {{ k3s_upgrade_target_version }}
      on {{ inventory_hostname }}. Downgrades and skipped minor releases are
      unsafe. Review the installed versions and remaining upgrade sequence;
      do not restart a completed earlier stage.
