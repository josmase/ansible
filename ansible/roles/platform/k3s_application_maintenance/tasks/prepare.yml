---
- name: Verify each planned Flux Kustomization exists
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ k3s_application_maintenance_flux_namespace }}"
      - get
      - kustomization.kustomize.toolkit.fluxcd.io
      - "{{ item }}"
      - -o
      - json
  loop: "{{ k3s_application_maintenance_flux_kustomizations }}"
  register: k3s_application_maintenance_flux_get
  changed_when: false
  check_mode: false

- name: Record planned Flux Kustomization state
  ansible.builtin.set_fact:
    k3s_application_maintenance_flux_state: >-
      {{ k3s_application_maintenance_flux_get.results | map(attribute='stdout') | map('from_json') | list }}

- name: Record application workload state
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ item }}"
      - get
      - deployment,statefulset
      - -o
      - json
  loop: "{{ k3s_application_maintenance_namespaces }}"
  register: k3s_application_maintenance_workloads_get
  changed_when: false
  check_mode: false

- name: Record application CronJob state
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ item }}"
      - get
      - cronjob
      - -o
      - json
  loop: "{{ k3s_application_maintenance_namespaces }}"
  register: k3s_application_maintenance_cronjobs_get
  changed_when: false
  check_mode: false

- name: Build the immutable maintenance-state record
  ansible.builtin.set_fact:
    k3s_application_maintenance_state:
      version: 1
      flux_kustomizations: "{{ k3s_application_maintenance_flux_state }}"
      workloads: "{{ k3s_application_maintenance_workloads_get.results | map(attribute='stdout') | map('from_json') | map(attribute='items') | flatten }}"
      cronjobs: "{{ k3s_application_maintenance_cronjobs_get.results | map(attribute='stdout') | map('from_json') | map(attribute='items') | flatten }}"

- name: Save application state before changing capacity
  ansible.builtin.copy:
    content: "{{ k3s_application_maintenance_state | to_nice_json }}\n"
    dest: "{{ k3s_application_maintenance_state_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Mark the saved state as owned by this preparation
  ansible.builtin.set_fact:
    k3s_application_maintenance_state_created: true

- name: Suspend the planned Flux Kustomizations
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ k3s_application_maintenance_flux_namespace }}"
      - patch
      - kustomization.kustomize.toolkit.fluxcd.io
      - "{{ item.metadata.name }}"
      - --type=merge
      - -p
      - '{"spec":{"suspend":true}}'
  loop: "{{ k3s_application_maintenance_flux_state }}"
  when: not (item.spec.suspend | default(false) | bool)
  changed_when: true

- name: Suspend CronJobs in application namespaces
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ item.metadata.namespace }}"
      - patch
      - cronjob
      - "{{ item.metadata.name }}"
      - --type=merge
      - -p
      - '{"spec":{"suspend":true}}'
  loop: "{{ k3s_application_maintenance_state.cronjobs }}"
  when: not (item.spec.suspend | default(false) | bool)
  changed_when: true

# Let existing Jobs finish while their application dependencies are still up.
- name: Wait for all active Jobs to finish after suspending application CronJobs
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - get
      - jobs
      - --all-namespaces
      - -o
      - json
  register: k3s_application_maintenance_jobs
  until: >-
    k3s_application_maintenance_jobs.rc == 0 and
    ((k3s_application_maintenance_jobs.stdout | from_json)['items']
      | selectattr('status.active', 'defined')
      | selectattr('status.active', 'gt', 0) | list | length) == 0
  retries: "{{ k3s_application_maintenance_capacity_retries }}"
  delay: "{{ k3s_application_maintenance_capacity_delay }}"
  changed_when: false

- name: Scale captured application workloads to zero
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ item.metadata.namespace }}"
      - scale
      - "{{ item.kind | lower }}/{{ item.metadata.name }}"
      - --replicas=0
  loop: "{{ k3s_application_maintenance_state.workloads }}"
  changed_when: true

# Desired replicas change immediately; Pods can keep consuming capacity until
# termination completes. DaemonSets remain running during the rolling upgrade.
- name: Wait for application Pods to terminate
  ansible.builtin.command:
    argv:
      - "{{ k3s_application_maintenance_api }}"
      - kubectl
      - -n
      - "{{ item }}"
      - get
      - pods
      - --field-selector=status.phase!=Succeeded,status.phase!=Failed
      - -o
      - json
  loop: "{{ k3s_application_maintenance_namespaces }}"
  register: k3s_application_maintenance_pods
  until: >-
    k3s_application_maintenance_pods.rc == 0 and
    ((k3s_application_maintenance_pods.stdout | from_json)['items'] | length) ==
    ((k3s_application_maintenance_pods.stdout | from_json)['items']
      | selectattr('metadata.ownerReferences', 'defined')
      | selectattr('metadata.ownerReferences.0.kind', 'defined')
      | selectattr('metadata.ownerReferences.0.kind', 'equalto', 'DaemonSet')
      | list | length)
  retries: "{{ k3s_application_maintenance_capacity_retries }}"
  delay: "{{ k3s_application_maintenance_capacity_delay }}"
  changed_when: false
