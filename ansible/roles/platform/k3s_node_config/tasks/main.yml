---
- name: Manage k3s runtime configuration (kubelet args)
  ansible.builtin.import_tasks: kubelet-config.yml
  tags:
    - kubelet
    - k3s_config

- name: Manage optional K3s Go memory limit
  ansible.builtin.import_tasks: go-memory.yml
  tags:
    - k3s_config
    - memory

- name: Manage inotify sysctls
  ansible.builtin.import_tasks: sysctl-inotify.yml
  tags:
    - sysctl
    - tuning

- name: Avoid fsck MOTD probes on CSI DRBD filesystems
  ansible.builtin.import_tasks: motd-fsck.yml
  tags:
    - motd
    - drbd_motd
