# Command adapters let the dedicated Molecule boundary scenario mock host tools.
gpu_unlock_secure_boot_command: "mokutil --sb-state"
gpu_unlock_deb_src_command: "apt-get indextargets --format '$(IDENTIFIER)' | grep -qx Sources"
gpu_unlock_nvidia_driver_command: "modinfo nvidia"
gpu_unlock_build_command: "apt-get build-dep -y . && make deb"
gpu_unlock_package_names:
  - gpu-unlock-dkms
  - gpu-unlock-firmware
