---
- name: Verify GPU unlock role behavior
  hosts: all
  become: true
  vars:
    gpu_unlock_test_revision: "{{ lookup('ansible.builtin.pipe', 'git -C /tmp/gpu-unlock-molecule/upstream rev-parse HEAD') | trim }}"
    gpu_unlock_enabled: true
    gpu_unlock_pci_devices:
      - vendor: "0x10de"
        device: "0x2206"
    gpu_unlock_revision: "{{ gpu_unlock_test_revision }}"
    gpu_unlock_grub_defaults_path: /tmp/gpu-unlock-molecule/grub
    gpu_unlock_revision_marker_path: /tmp/gpu-unlock-molecule/revision
    gpu_unlock_source_path: /tmp/gpu-unlock-molecule/source
    gpu_unlock_repository_url: file:///tmp/gpu-unlock-molecule/upstream
    gpu_unlock_secure_boot_command: "printf 'SecureBoot disabled\\n'"
    gpu_unlock_deb_src_command: "true"
    gpu_unlock_nvidia_driver_command: "true"
    gpu_unlock_build_command: >-
      mkdir -p build/deb package/DEBIAN &&
      printf 'Package: gpu-unlock-dkms\nVersion: 1.0.0\nArchitecture: all\nMaintainer: Molecule <molecule@example.invalid>\nDescription: test package\n' > package/DEBIAN/control &&
      dpkg-deb --build package build/deb/gpu-unlock-dkms_1.0.0_all.deb
    gpu_unlock_kernel_headers_path: /tmp
  tasks:
    - name: Confirm the role adds only its GRUB token
      ansible.builtin.slurp:
        src: /tmp/gpu-unlock-molecule/grub
      register: gpu_unlock_molecule_grub

    - name: Verify preserved GRUB configuration after installation
      ansible.builtin.assert:
        that:
          - "'GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash net.ifnames=0 gpu_unlock.targets=all\"' in (gpu_unlock_molecule_grub.content | b64decode)"
          - "'GRUB_CMDLINE_LINUX=\"keep=this gpu_unlock.targets=all\"' in (gpu_unlock_molecule_grub.content | b64decode)"

    - name: Exercise an Ineligible host at the role boundary
      ansible.builtin.include_role:
        name: platform/gpu_unlock
      vars:
        gpu_unlock_enabled: true
        gpu_unlock_pci_devices:
          - vendor: "0x10de"
            device: "0xffff"
        gpu_unlock_revision_marker_path: /tmp/gpu-unlock-molecule/ineligible-revision

    - name: Confirm an Ineligible host remains a no-op
      ansible.builtin.stat:
        path: /tmp/gpu-unlock-molecule/ineligible-revision
      register: gpu_unlock_molecule_ineligible_marker

    - name: Verify Ineligible host behavior
      ansible.builtin.assert:
        that: not gpu_unlock_molecule_ineligible_marker.stat.exists

    - name: Exercise matching-header prerequisite failure
      block:
        - name: Apply GPU unlock without matching kernel headers
          ansible.builtin.include_role:
            name: platform/gpu_unlock
          vars:
            gpu_unlock_kernel_headers_path: /missing-headers
        - ansible.builtin.fail:
            msg: GPU unlock must require matching headers.
      rescue:
        - ansible.builtin.set_fact:
            gpu_unlock_molecule_headers_rejected: true

    - name: Verify missing headers rejection
      ansible.builtin.assert:
        that: gpu_unlock_molecule_headers_rejected | default(false)

    - name: Exercise NVIDIA driver prerequisite failure
      block:
        - name: Apply GPU unlock without a driver
          ansible.builtin.include_role:
            name: platform/gpu_unlock
          vars:
            gpu_unlock_nvidia_driver_command: "false"
        - ansible.builtin.fail:
            msg: GPU unlock must require an NVIDIA driver.
      rescue:
        - ansible.builtin.set_fact:
            gpu_unlock_molecule_driver_rejected: true

    - name: Verify missing driver rejection
      ansible.builtin.assert:
        that: gpu_unlock_molecule_driver_rejected | default(false)

    - name: Exercise Secure Boot prerequisite failure
      block:
        - name: Apply GPU unlock with Secure Boot enabled
          ansible.builtin.include_role:
            name: platform/gpu_unlock
          vars:
            gpu_unlock_secure_boot_command: "printf 'SecureBoot enabled\\n'"
        - ansible.builtin.fail:
            msg: GPU unlock must reject Secure Boot.
      rescue:
        - ansible.builtin.set_fact:
            gpu_unlock_molecule_secure_boot_rejected: true

    - name: Verify Secure Boot rejection
      ansible.builtin.assert:
        that: gpu_unlock_molecule_secure_boot_rejected | default(false)

    - name: Reconcile the installed role to prove idempotence
      ansible.builtin.include_role:
        name: platform/gpu_unlock

    - name: Verify an unchanged reconciliation needs no reboot
      ansible.builtin.assert:
        that: not gpu_unlock_reboot_required | bool

    - name: Place the GRUB token in the middle of its owned variable
      ansible.builtin.copy:
        dest: /tmp/gpu-unlock-molecule/grub
        content: |-
          GRUB_CMDLINE_LINUX_DEFAULT="quiet gpu_unlock.targets=all splash net.ifnames=0"
          GRUB_CMDLINE_LINUX="keep=this gpu_unlock.targets=all"
        mode: "0644"

    - name: Remove GPU unlock through its public opt-in
      ansible.builtin.include_role:
        name: platform/gpu_unlock
      vars:
        gpu_unlock_enabled: false
        gpu_unlock_grub_defaults_path: /tmp/gpu-unlock-molecule/grub
        gpu_unlock_revision_marker_path: /tmp/gpu-unlock-molecule/revision

    - name: Read GRUB defaults after removal
      ansible.builtin.slurp:
        src: /tmp/gpu-unlock-molecule/grub
      register: gpu_unlock_molecule_removed_grub

    - name: Assert removal preserves unrelated GRUB configuration
      ansible.builtin.assert:
        that:
          - "'GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash net.ifnames=0\"' in (gpu_unlock_molecule_removed_grub.content | b64decode)"
          - "'GRUB_CMDLINE_LINUX=\"keep=this gpu_unlock.targets=all\"' in (gpu_unlock_molecule_removed_grub.content | b64decode)"

    - name: Assert removal deletes the deployed revision record
      ansible.builtin.stat:
        path: /tmp/gpu-unlock-molecule/revision
      register: gpu_unlock_molecule_removed_revision

    - name: Verify revision record removal and reboot reporting
      ansible.builtin.assert:
        that:
          - not gpu_unlock_molecule_removed_revision.stat.exists
          - gpu_unlock_reboot_required | bool

    - name: Provide post-reboot verification command fixtures
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
        mode: "0755"
      loop:
        - path: /usr/local/bin/lsmod
          content: |-
            #!/bin/sh
            printf '%s\\n' 'gpu_unlock 16384 0'
        - path: /usr/local/bin/journalctl
          content: |-
            #!/bin/sh
            printf '%s\\n' 'gpu_unlock: completed during this boot'

    - name: Verify GPU unlock after a simulated reboot
      ansible.builtin.import_role:
        name: platform/gpu_unlock
        tasks_from: verify
