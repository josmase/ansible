workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages: [infrastructure]

dns:
  stage: infrastructure
  trigger:
    include:
      - component: $CI_SERVER_FQDN/josmase/infrastructure/ci-templates/ansible-opentofu@v4.2.0
        inputs:
          tf_root: opentofu/dns
          state_name: dns
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TOFU_ROOT == "dns" || $TOFU_ROOT == "all")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      changes:
        - opentofu/dns/**/*
        - .gitlab-ci.yml

virtual-machines:
  stage: infrastructure
  trigger:
    include:
      - component: $CI_SERVER_FQDN/josmase/infrastructure/ci-templates/ansible-opentofu@v4.2.0
        inputs:
          tf_root: opentofu/virtual-machines
          state_name: virtual-machines
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && ($TOFU_ROOT == "virtual-machines" || $TOFU_ROOT == "all")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      changes:
        - opentofu/virtual-machines/**/*
        - .gitlab-ci.yml
